; PlatformIO Project Configuration Override for ESP32-S3 LVGL
; Custom build environment for Waveshare ESP32S3-Geek
; by Harald Kiessling

[platformio]
; Uncomment to set default build environment
default_envs = tasmota32s3-lvgl

; *** ESP32-S3 LVGL Build Environment ***
[env:tasmota32s3-lvgl]
extends                 = env:tasmota32-lvgl
board                   = esp32s3-qio_qspi
board_build.f_cpu       = 240000000L
board_build.flash_mode  = qio
board_build.psram_type  = qspi
board_build.memory_type = qio_qspi

; Partition scheme for ESP32-S3 with LVGL
board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv

; Build flags (add to base)
build_flags             = ${env:tasmota32-lvgl.build_flags}
                          -DESP32_S3
                          -DBOARD_HAS_PSRAM
                          -mfix-esp32-psram-cache-issue
                          -mfix-esp32-psram-cache-strategy=memw

; Upload settings
upload_speed            = 921600
monitor_speed           = 115200

; *** Alternative: ESP32-S3 LVGL with 1024k filesystem ***
[env:tasmota32s3-lvgl-fs1024k]
extends                 = env:tasmota32s3-lvgl
board_build.partitions  = partitions/esp32_partition_app2944k_fs1024k.csv

; *** Alternative: ESP32-S3 LVGL with 320k filesystem (minimal) ***
[env:tasmota32s3-lvgl-minimal]
extends                 = env:tasmota32s3-lvgl
board_build.partitions  = partitions/esp32_partition_app3264k_fs320k.csv
